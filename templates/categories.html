{% extends 'base.html' %}
{% block title %}类别管理 - 记账本{% endblock %}
{% block content %}
<div class="card">
  <div class="page-title">类别管理</div>
  <div class="filters">
    <div class="field">
      <label>添加一级分类</label>
      <div style="display:flex;gap:8px">
        <input type="text" id="c-name" placeholder="一级分类名称" style="width:200px">
        <button class="btn btn-primary" id="btn-add-top">添加</button>
      </div>
    </div>
    <div class="field">
      <label>添加二级分类</label>
      <div style="display:flex;gap:8px">
        <select id="c-parent" style="width:160px"><option value="">选择所属一级</option></select>
        <input type="text" id="c-sub-name" placeholder="二级分类名称" style="width:160px">
        <button class="btn btn-primary" id="btn-add-sub">添加</button>
      </div>
    </div>
  </div>
</div>

<div class="cat-grid" id="cat-grid"></div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='app.js') }}"></script>
<script>
const $ = id => document.getElementById(id);
let renamingId = null;

async function load() {
  const data = await api('/api/categories');
  const tops = data.categories.filter(c => !c.parent_id);
  const subs = data.categories.filter(c => c.parent_id);

  // 填充添加二级分类的下拉
  $('c-parent').innerHTML = '<option value="">选择所属一级</option>' +
    tops.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('');

  // 渲染卡片
  $('cat-grid').innerHTML = tops.map(top => {
    const c = categoryColor(top.name);
    const children = subs.filter(s => s.parent_id === top.id);
    const topCnt = data.categories.find(x => x.id === top.id)?.cnt || 0;
    return `<div class="cat-card" style="border-color:${c}44">
      <div class="cat-card-header" style="background:${c}1a;color:${c};border-bottom:2px solid ${c}33">
        <span class="cat-card-name">${esc(top.name)}</span>
        <span class="cat-card-cnt">${topCnt} 笔</span>
      </div>
      <div class="cat-card-body">
        ${children.length ? children.map(sub => {
          const subCnt = data.categories.find(x => x.id === sub.id)?.cnt || 0;
          return `<div class="cat-sub-row">
            <span class="cat-sub-name">${esc(sub.name)}</span>
            <span class="cat-card-cnt">${subCnt} 笔</span>
            <span class="cat-sub-actions">
              <button class="btn-link" onclick="renameCat(${sub.id},'${esc(sub.name)}')">重命名</button>
              <button class="btn-link danger" onclick="delCat(${sub.id})">删除</button>
            </span>
          </div>`;
        }).join('') : '<div class="cat-sub-row text-muted" style="font-size:12px;padding:6px 0">暂无二级分类</div>'}
      </div>
      <div class="cat-card-actions">
        <button class="btn-link" onclick="renameCat(${top.id},'${esc(top.name)}')">重命名</button>
        <button class="btn-link danger" onclick="delCat(${top.id})">删除</button>
      </div>
    </div>`;
  }).join('') || '<div class="text-muted" style="text-align:center;padding:40px">暂无分类</div>';
}

window.renameCat = async (id, name) => {
  const newName = prompt('新的类别名称：', name);
  if (newName === null) return;
  try {
    await api('/api/category/' + id, { method: 'POST', body: { name: newName } });
    toast('已重命名');
    load();
  } catch (err) { toast(err.message, true); }
};

window.delCat = async id => {
  if (!confirm('确定删除该类别？')) return;
  try {
    await api('/api/category/' + id, { method: 'DELETE' });
    toast('已删除');
    load();
  } catch (err) { toast(err.message, true); }
};

$('btn-add-top').onclick = async () => {
  const name = $('c-name').value.trim();
  if (!name) { toast('请输入一级分类名称', true); return; }
  try {
    await api('/api/categories', { method: 'POST', body: { name } });
    $('c-name').value = '';
    toast('已添加');
    load();
  } catch (err) { toast(err.message, true); }
};

$('btn-add-sub').onclick = async () => {
  const name = $('c-sub-name').value.trim();
  const parent_id = $('c-parent').value;
  if (!name) { toast('请输入二级分类名称', true); return; }
  if (!parent_id) { toast('请选择所属一级分类', true); return; }
  try {
    await api('/api/categories', { method: 'POST', body: { name, parent_id: Number(parent_id) } });
    $('c-sub-name').value = '';
    toast('已添加');
    load();
  } catch (err) { toast(err.message, true); }
};

load();
</script>
{% endblock %}
