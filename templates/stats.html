{% extends 'base.html' %}
{% block title %}统计分析 - 记账本{% endblock %}
{% block content %}
<div class="card">
  <div class="page-title">统计分析</div>
  <div class="filters">
    <label>起始月份</label>
    <select id="s-start"></select>
    <label>结束月份</label>
    <select id="s-end"></select>
    <select id="s-category"><option value="">全部类别</option></select>
    <select id="s-subcategory"><option value="">全部二级分类</option></select>
    <select id="s-bookkeeper"><option value="">全部记账人</option></select>
    <button class="btn btn-primary" id="btn-query">查询</button>
    <button class="btn" id="btn-reset">重置</button>
    <div class="spacer"></div>
    <span class="small text-muted" id="stats-range"></span>
  </div>
</div>

<div class="grid-2">
  <div class="card"><div class="chart-title">月度消费对比</div><div id="chart-monthly" class="chart"></div></div>
  <div class="card"><div class="chart-title">月度趋势（含 3 月均线）</div><div id="chart-trend" class="chart"></div></div>
  <div class="card">
    <div class="chart-title" style="display:flex;align-items:center;gap:10px">
      <span id="cat-chart-title">类别占比</span>
      <button class="btn-link" id="btn-drill-back" style="display:none">← 返回</button>
    </div>
    <div id="chart-category" class="chart"></div>
  </div>
  <div class="card"><div class="chart-title">商家 / 交易对方 Top 10</div><div id="chart-merchant" class="chart"></div></div>
  <div class="card"><div class="chart-title">周内分布</div><div id="chart-weekday" class="chart"></div></div>
  <div class="card"><div class="chart-title">支付方式分布</div><div id="chart-paymethod" class="chart"></div></div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='echarts.min.js') }}"></script>
<script>window.echarts || document.write('<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"><\/script>')</script>
<script src="{{ url_for('static', filename='app.js') }}"></script>
<script>
const $ = id => document.getElementById(id);
const charts = {};
const DOW = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
let CATEGORIES = [];
let subcatsMap = {};   // parent_name -> [{name, total}]
let drillParent = null;  // 当前下钻的一级分类名，null = 未下钻

function chart(id) {
  if (!charts[id]) charts[id] = echarts.init($(id));
  return charts[id];
}

function rebuildSubFilter() {
  const sel = $('s-subcategory');
  const v = $('s-category').value;
  const subs = CATEGORIES.filter(c => c.parent_id != null);
  let opts = '<option value="">全部二级分类</option>';
  if (!v) {
    CATEGORIES.filter(c => !c.parent_id).forEach(top => {
      const kids = subs.filter(s => s.parent_id === top.id);
      if (!kids.length) return;
      opts += `<optgroup label="${esc(top.name)}">`;
      opts += kids.map(s => `<option value="${s.id}">&nbsp;&nbsp;${esc(s.name)}</option>`).join('');
      opts += '</optgroup>';
    });
  } else {
    const topId = Number(v);
    opts += subs.filter(s => s.parent_id === topId)
      .map(s => `<option value="${s.id}">&nbsp;&nbsp;${esc(s.name)}</option>`).join('');
  }
  sel.innerHTML = opts;
}

function renderCategoryPie(d) {
  const el = chart('chart-category');
  if (drillParent) {
    const subs = subcatsMap[drillParent] || [];
    if (!subs.length) {
      el.clear();
      el.setOption({ title: { text: '无二级分类数据', left: 'center', top: 'center' } });
      return;
    }
    const color = categoryColor(drillParent);
    el.setOption({
      tooltip: { trigger: 'item', formatter: '{b}: ¥{c} ({d}%)' },
      series: [{ type: 'pie', radius: ['40%', '68%'],
        data: subs.map(x => ({ name: x.name, value: x.total })),
        label: { formatter: '{b}\n{d}%' },
        itemStyle: { color } }],
    }, true);
  } else {
    el.setOption({
      tooltip: { trigger: 'item', formatter: '{b}: ¥{c} ({d}%)' },
      series: [{ type: 'pie', radius: ['40%', '68%'],
        data: d.categories.map(x => ({ name: x.name, value: x.total })),
        label: { formatter: '{b}\n{d}%' },
        emphasis: { itemStyle: { shadowBlur: 10, shadowOffsetX: 0, shadowColor: 'rgba(0,0,0,0.5)' } } }],
    }, true);
    el.off('click');
    el.on('click', params => {
      const name = params.name;
      if (subcatsMap[name] && subcatsMap[name].length) {
        drillParent = name;
        $('cat-chart-title').textContent = name + ' › 二级分布';
        $('btn-drill-back').style.display = 'inline';
        renderCategoryPie(d);
      }
    });
  }
}

async function loadStats() {
  const qs = new URLSearchParams();
  if ($('s-start').value) qs.set('start', $('s-start').value);
  if ($('s-end').value) qs.set('end', $('s-end').value);
  if ($('s-category').value) qs.set('category', $('s-category').value);
  if ($('s-subcategory').value) qs.set('subcategory', $('s-subcategory').value);
  if ($('s-bookkeeper').value) qs.set('bookkeeper', $('s-bookkeeper').value);
  const d = await api('/api/stats?' + qs);
  if (!d.monthly.length) {
    Object.values(charts).forEach(c => c.clear());
    $('stats-range').textContent = '暂无数据';
    return;
  }
  $('stats-range').textContent =
    `范围：${d.monthly[0].month} ~ ${d.monthly[d.monthly.length - 1].month}`;

  const months = d.monthly.map(x => x.month);
  const totals = d.monthly.map(x => x.total);

  subcatsMap = {};
  d.subcats.forEach(x => {
    if (!subcatsMap[x.parent]) subcatsMap[x.parent] = [];
    subcatsMap[x.parent].push({ name: x.name, total: x.total });
  });

  // 1. 月度对比（柱状）
  chart('chart-monthly').setOption({
    tooltip: { trigger: 'axis', valueFormatter: v => '¥' + v },
    xAxis: { type: 'category', data: months },
    yAxis: { type: 'value' },
    series: [{ type: 'bar', data: totals, itemStyle: { color: '#ef5350', borderRadius: [4, 4, 0, 0] } }],
    grid: { left: 50, right: 20, top: 20, bottom: 30 },
  }, true);

  // 2. 月度趋势（折线 + 3 月均线）
  const ma = totals.map((_, i) =>
    i < 2 ? null : +( (totals[i-2] + totals[i-1] + totals[i]) / 3 ).toFixed(2));
  chart('chart-trend').setOption({
    tooltip: { trigger: 'axis', valueFormatter: v => '¥' + v },
    xAxis: { type: 'category', data: months },
    yAxis: { type: 'value', scale: true },
    series: [
      { name: '月消费', type: 'line', data: totals, smooth: true,
        itemStyle: { color: '#ef5350' }, areaStyle: { opacity: 0.08 } },
      { name: '3月均线', type: 'line', data: ma, smooth: true, symbol: 'none',
        lineStyle: { type: 'dashed', color: '#5c6bc0' } },
    ],
    grid: { left: 50, right: 20, top: 30, bottom: 30 },
  }, true);

  // 3. 类别占比（环形 + 下钻）
  renderCategoryPie(d);

  // 4. 商家 Top10（横向条形）
  const merch = [...d.merchants].reverse();
  chart('chart-merchant').setOption({
    tooltip: { trigger: 'axis', valueFormatter: v => '¥' + v },
    xAxis: { type: 'value' },
    yAxis: { type: 'category',
      data: merch.map(x => x.name.length > 10 ? x.name.slice(0, 10) + '…' : x.name) },
    series: [{ type: 'bar', data: merch.map(x => x.total),
      itemStyle: { color: '#5c6bc0', borderRadius: [0, 4, 4, 0] },
      label: { show: true, position: 'right', formatter: p => '¥' + p.value } }],
    grid: { left: 110, right: 70, top: 10, bottom: 30 },
  }, true);

  // 5. 周内分布
  const wd = [0, 0, 0, 0, 0, 0, 0];
  d.weekday.forEach(x => wd[x.dow] = x.total);
  chart('chart-weekday').setOption({
    tooltip: { trigger: 'axis', valueFormatter: v => '¥' + v },
    xAxis: { type: 'category', data: DOW },
    yAxis: { type: 'value' },
    series: [{ type: 'bar', data: wd,
      itemStyle: { color: '#26a69a', borderRadius: [4, 4, 0, 0] } }],
    grid: { left: 50, right: 20, top: 20, bottom: 30 },
  }, true);

  // 6. 支付方式分布
  chart('chart-paymethod').setOption({
    tooltip: { trigger: 'item', formatter: '{b}: ¥{c} ({d}%)' },
    series: [{ type: 'pie', radius: '62%',
      data: d.paymethod.map(x => ({ name: x.name, value: x.total })),
      label: { formatter: '{b}\n{d}%' } }],
  }, true);
}

$('btn-drill-back').onclick = () => {
  drillParent = null;
  $('cat-chart-title').textContent = '类别占比';
  $('btn-drill-back').style.display = 'none';
  loadStats();
};

$('s-category').onchange = () => {
  rebuildSubFilter();
  drillParent = null;
  $('cat-chart-title').textContent = '类别占比';
  $('btn-drill-back').style.display = 'none';
};

$('s-subcategory').onchange = () => {
  drillParent = null;
  $('cat-chart-title').textContent = '类别占比';
  $('btn-drill-back').style.display = 'none';
};

async function init() {
  const [meta, d] = await Promise.all([api('/api/meta'), api('/api/stats')]);
  CATEGORIES = meta.categories;
  const monthOpts = '<option value="">（不限）</option>' +
    d.months.map(m => `<option value="${m}">${m}</option>`).join('');
  $('s-start').innerHTML = monthOpts;
  $('s-end').innerHTML = monthOpts;
  if (d.months.length) $('s-end').value = d.months[d.months.length - 1];

  $('s-category').innerHTML = '<option value="">全部类别</option>' + topOptions(CATEGORIES);
  rebuildSubFilter();

  $('s-bookkeeper').innerHTML = '<option value="">全部记账人</option>' +
    meta.bookkeepers.map(b => `<option value="${esc(b)}">${esc(b)}</option>`).join('');

  loadStats();
  window.addEventListener('resize', () =>
    Object.values(charts).forEach(c => c.resize()));
}

$('btn-query').onclick = loadStats;
$('btn-reset').onclick = () => {
  $('s-start').value = '';
  $('s-end').value = '';
  $('s-category').value = '';
  rebuildSubFilter();
  $('s-bookkeeper').value = '';
  drillParent = null;
  $('cat-chart-title').textContent = '类别占比';
  $('btn-drill-back').style.display = 'none';
  loadStats();
};
init();
</script>
{% endblock %}
